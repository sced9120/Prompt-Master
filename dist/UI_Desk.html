<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root { --line:#dde3dd; --muted:#6b7280; --accent:#35583f; --accent-soft:#e3ece4; --ink:#16202a;
          --warn:#8f2f20; --warn-soft:#f8eae6; --chk:#7a5200; --chk-soft:#fff4d6; --ok:#2c6340; --bg:#f6f8f6;
          --input:#fff8e1; --ai:#eef6ef; --final:#eaf2fb; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; }
  body { color:var(--ink); background:#fff; font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  button { font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:6px 11px; border:1px solid #c9d1c9;
           border-radius:7px; background:#fff; color:var(--ink); }
  button:hover:not(:disabled) { background:var(--bg); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover:not(:disabled) { background:#2b4733; }
  button.ghost { border-color:transparent; background:transparent; }
  button:disabled { opacity:.45; cursor:default; }
  select, input[type=search] { font:inherit; padding:5px 8px; border:1px solid #c9d1c9; border-radius:7px; background:#fff; }
  textarea { width:100%; font:inherit; font-size:13.5px; line-height:1.65; padding:8px 10px; border:1px solid #c9d1c9;
             border-radius:8px; resize:vertical; }
  textarea:focus, select:focus, input:focus { outline:2px solid #9fbfa7; outline-offset:0; }

  /* 위 */
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); flex:none; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid #c9d1c9; border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:6px 14px; }
  .seg button.on { background:var(--accent); color:#fff; }
  .clsbox { display:flex; align-items:center; gap:6px; font-size:12.5px; }
  .clsbox b { color:var(--accent); }
  /* 길잡이 줄 (v3.2.0) */
  .guide { display:flex; align-items:center; gap:4px; padding:5px 12px; border-bottom:1px solid var(--line); background:var(--bg); flex:none; flex-wrap:wrap; font-size:12.5px; }
  .gstep { border:1px solid transparent; background:transparent; border-radius:14px; padding:2px 10px 2px 4px; font-weight:400; color:var(--muted); }
  .gstep:hover { border-color:#c9d1c9; background:#fff; }
  .gstep .gmark { display:inline-block; width:18px; height:18px; line-height:18px; border-radius:50%; background:#e6ebe6; color:var(--muted); text-align:center; font-size:11px; font-weight:700; margin-right:4px; }
  .gstep .gsub { font-size:11.5px; }
  .gstep.done { color:var(--ink); } .gstep.done .gmark { background:var(--accent-soft); color:var(--ok); }
  .gstep.next { border-color:var(--accent); background:#fff; color:var(--accent); font-weight:700; } .gstep.next .gmark { background:var(--accent); color:#fff; }
  .garrow { color:#b5beb5; }
  .gsay { margin-left:10px; color:var(--accent); font-weight:700; }
  .gdemo { margin-left:auto; border:0; background:transparent; color:var(--muted); font-weight:400; font-size:12px; text-decoration:underline; padding:0 4px; }
  ol.first { text-align:left; display:inline-block; margin:10px auto 4px; padding-left:22px; line-height:1.9; max-width:620px; }
  ol.first .okmark { color:var(--ok); font-weight:700; }
  .firstnote { margin-top:10px; color:var(--muted); font-size:12.5px; }
  .spacer { flex:1; }
  .tabs { display:flex; gap:4px; padding:6px 12px 0; border-bottom:1px solid var(--line); flex:none; overflow-x:auto; overflow-y:hidden; }
  .tab { border:1px solid var(--line); border-bottom:0; border-radius:8px 8px 0 0; padding:6px 12px; background:var(--bg);
         font-weight:600; font-size:12.5px; white-space:nowrap; cursor:pointer; }
  .tab.on { background:#fff; color:var(--accent); box-shadow:0 2px 0 #fff; }
  .tab .rec { font-weight:400; color:var(--muted); font-size:11px; margin-left:4px; }

  /* 세 칸 */
  .cols { flex:1; display:grid; grid-template-columns:230px minmax(0,1fr) 290px; min-height:0; }
  .left, .right { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .right { border-right:0; border-left:1px solid var(--line); }
  .left .find { padding:8px; border-bottom:1px solid var(--line); }
  .left .find input { width:100%; }
  .list { overflow:auto; flex:1; }
  .st { display:flex; align-items:center; gap:7px; padding:6px 10px; cursor:pointer; border-bottom:1px solid #f0f2f0; }
  .st:hover { background:var(--bg); }
  .st.on { background:var(--accent-soft); }
  .st .no { width:34px; color:var(--muted); font-size:11.5px; text-align:right; flex:none; }
  .st .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .dots { display:flex; gap:3px; flex:none; }
  .dot { width:8px; height:8px; border-radius:50%; border:1.5px solid #b8c4b9; }
  .dot.ai { background:#cfe3d3; border-color:#8db497; }
  .dot.fin { background:var(--accent); border-color:var(--accent); }
  .dot.cur { outline:2px solid #e7b84c; outline-offset:1px; }
  .lfoot { padding:7px 10px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }

  .mid { overflow:auto; padding:12px 16px 0; min-height:0; }
  .who { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .who h2 { margin:0; font-size:17px; }
  .who .sub { color:var(--muted); font-size:12px; }
  .lab { font-size:12px; font-weight:700; margin:12px 0 4px; display:flex; align-items:center; gap:8px; }
  .lab .hint { font-weight:400; color:var(--muted); font-size:11.5px; }
  .in textarea { background:var(--input); }
  .aibox { background:var(--ai); border:1px solid #cfe0d2; border-radius:8px; padding:8px 10px; white-space:pre-wrap; word-break:keep-all;
           min-height:46px; font-size:13.5px; line-height:1.65; }
  .aibox.empty { color:var(--muted); font-size:12.5px; }
  #fin { background:var(--final); min-height:130px; }
  .meter { display:flex; align-items:center; gap:8px; margin-top:5px; font-size:12px; color:var(--muted); }
  .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .bar.over i { background:var(--warn); }
  .dock { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); margin:12px -16px 0; padding:8px 16px 10px; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; align-items:center; }
  .save { font-size:12px; color:var(--muted); margin-left:auto; }
  .save.dirty { color:var(--chk); } .save.err { color:var(--warn); }
  .empty-state { max-width:560px; margin:40px auto; text-align:center; color:var(--muted); }
  .empty-state h3 { color:var(--ink); margin:0 0 6px; }
  .empty-state .row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:12px; }

  .right .rh { padding:9px 12px; border-bottom:1px solid var(--line); font-weight:700; display:flex; align-items:center; gap:8px; }
  .right .rh .src { font-weight:400; font-size:11.5px; color:var(--muted); }
  .rbody { overflow:auto; padding:8px 12px; flex:1; }
  .sum { border-radius:7px; padding:7px 10px; font-weight:600; font-size:12.5px; margin-bottom:8px; }
  .sum.ok { background:var(--accent-soft); color:var(--ok); } .sum.bad { background:var(--warn-soft); color:var(--warn); }
  .sum.chk { background:var(--chk-soft); color:var(--chk); }
  .iss { border-bottom:1px solid var(--line); padding:6px 0; font-size:12px; }
  .lv { font-size:10.5px; font-weight:700; border-radius:4px; padding:0 5px; margin-right:4px; }
  .lv.block { background:var(--warn-soft); color:var(--warn); } .lv.check { background:var(--chk-soft); color:var(--chk); }
  .iss .why { color:var(--muted); font-size:11.5px; } .iss .fix { color:var(--ok); font-weight:600; }
  .rnote { font-size:11.5px; color:var(--muted); padding:8px 12px; border-top:1px solid var(--line); }

  /* 표 보기 — 학생 = 줄, 입력 항목 · AI 결과 · 최종본 · 바이트 = 열 */
  .cols.grid { grid-template-columns:minmax(0,1fr) 270px; }
  .cols.grid .left { display:none; }
  .mid.gridmode { padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .gbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:7px 10px; border-bottom:1px solid var(--line); flex:none; }
  .gbar input[type=search] { width:150px; }
  .ghint { color:var(--muted); font-size:11.5px; padding:4px 10px; border-bottom:1px solid var(--line); background:var(--bg); flex:none; }
  .gwrap { flex:1; overflow:auto; min-height:0; }
  table.grid { border-collapse:separate; border-spacing:0; font-size:12.5px; }
  table.grid th, table.grid td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0; vertical-align:top; background:#fff; }
  table.grid th { position:sticky; top:0; z-index:2; background:#eef1ee; padding:5px 8px; text-align:left; font-size:12px; white-space:nowrap; }
  table.grid th.c-in { background:#f6e9bd; } table.grid th.c-ai { background:#d5e6d9; } table.grid th.c-fin { background:#d3e2f4; }
  table.grid .c-chk { width:30px; min-width:30px; text-align:center; position:sticky; left:0; }
  table.grid .c-no { width:50px; min-width:50px; position:sticky; left:30px; color:var(--muted); }
  table.grid .c-nm { width:84px; min-width:84px; position:sticky; left:80px; font-weight:600; }
  table.grid td.c-chk, table.grid td.c-no, table.grid td.c-nm { z-index:1; padding:6px; background:#fafbfa; }
  table.grid th.c-chk, table.grid th.c-no, table.grid th.c-nm { z-index:3; }
  table.grid tr.on td.c-chk, table.grid tr.on td.c-no, table.grid tr.on td.c-nm { background:var(--accent-soft); }
  table.grid td.c-in { width:200px; min-width:200px; } table.grid td.c-ai { width:270px; min-width:270px; }
  table.grid td.c-fin { width:320px; min-width:320px; }
  table.grid textarea { border:0; border-radius:0; resize:none; height:64px; font-size:12.5px; line-height:1.5; padding:5px 7px; display:block; }
  table.grid td.c-in textarea { background:var(--input); } table.grid td.c-fin textarea { background:var(--final); }
  table.grid textarea:focus { outline:2px solid var(--accent); outline-offset:-2px; }
  table.grid tr.on textarea, table.grid tr.on .gai { height:150px; }
  .gai { height:64px; overflow:auto; padding:5px 7px; background:var(--ai); white-space:pre-wrap; word-break:keep-all; line-height:1.5; }
  .gai.none { color:var(--muted); }
  table.grid td.c-by { padding:6px 8px; white-space:nowrap; text-align:right; color:var(--muted); min-width:92px; }
  table.grid td.c-by.over { color:var(--warn); font-weight:700; }
  table.grid td.c-gone { padding:6px 8px; color:var(--muted); }
  .hbtn { border:0; background:transparent; padding:0 4px; margin-left:4px; color:var(--muted); font-weight:400; }
  .crow { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .crow .cn { width:18px; color:var(--muted); text-align:right; }
  .crow input { flex:1; font:inherit; padding:5px 8px; border:1px solid #c9d1c9; border-radius:7px; }
  .crow .new { font-size:11px; color:var(--ok); font-weight:700; }

  /* 키 없이 · 반 고르기 덮개 */
  .cover { position:fixed; inset:0; background:rgba(20,30,24,.35); display:flex; align-items:center; justify-content:center; z-index:5; }
  .card { background:#fff; border-radius:12px; padding:16px 18px; width:min(760px,92vw); max-height:90vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .card h3 { margin:0 0 6px; font-size:15px; }
  .card .mono { font-family:Consolas,"D2Coding",monospace; font-size:12px; background:var(--bg); }
  .clsgrid { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .msg { font-size:12px; min-height:16px; margin-top:6px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--warn); }
  .toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#1e2a24; color:#fff; padding:8px 14px;
           border-radius:8px; font-size:12.5px; z-index:9; max-width:80vw; }
  .busy { position:fixed; inset:0; background:rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; z-index:8;
          font-weight:700; color:var(--accent); }
  /* 창 안 활동 · 설정 (v3.1.1) */
  .tgrp { align-self:center; font-size:11.5px; font-weight:700; color:var(--muted); margin:0 2px 0 10px; white-space:nowrap; }
  .tgrp:first-child { margin-left:0; }
  .tadd, .tcfg { align-self:center; padding:3px 9px; font-size:12px; white-space:nowrap; margin-bottom:3px; }
  .tadd { border-style:dashed; color:var(--accent); }
  .tcfg { margin-left:auto; }
  .card input[type=text], .card input[type=number], .card input[type=password] { font:inherit; padding:5px 8px; border:1px solid #c9d1c9; border-radius:7px; width:100%; }
  .frow { display:flex; gap:10px; flex-wrap:wrap; }
  .frow .fld { flex:1; min-width:150px; }
  .fld { margin-top:9px; }
  .fld > label { display:block; font-size:12px; font-weight:700; margin-bottom:3px; }
  .card .hint { font-weight:400; color:var(--muted); font-size:11.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; align-items:center; }
  .chips button { padding:3px 9px; font-size:12px; font-weight:400; }
  .chip { background:var(--input); border:1px solid #e6d9a8; border-radius:12px; padding:2px 9px; font-size:12px; }
  .sec { border-top:1px solid var(--line); margin-top:12px; padding-top:9px; }
  .sec h4 { margin:0 0 4px; font-size:13px; }
  .sec summary { cursor:pointer; font-size:12.5px; font-weight:600; }
  .foot { display:flex; gap:6px; justify-content:flex-end; margin-top:10px; position:sticky; bottom:-16px; background:#fff; padding:8px 0 2px; }
  .exbox { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:6px; }
  .exbox .fld { margin-top:5px; }
  .krow { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .krow .kn { width:74px; font-weight:700; font-size:12.5px; } .krow .ks { width:64px; font-size:12px; }
  .krow input { flex:1; }
  .tog { display:flex; gap:8px; align-items:flex-start; padding:5px 0; cursor:pointer; }
  .tog input { margin-top:3px; }
  .tog small { display:block; color:var(--muted); font-size:11.5px; }
  button.danger { color:var(--warn); border-color:#e5c3bd; }
  /* 취합 · 나이스 (v3.1.2) */
  table.sum td.c-ai { width:290px; min-width:290px; } table.sum td.c-fin { width:340px; min-width:340px; }
  table.sum .gai, table.sum textarea { height:96px; }
  table.sum tr.on .gai, table.sum tr.on textarea { height:200px; }
  table.sum td.c-by { min-width:118px; line-height:1.7; }
  .spart + .spart { margin-top:4px; }
  .spart b { color:var(--accent); font-size:11.5px; margin-right:3px; }
  .sst { display:inline-block; border-radius:10px; padding:0 8px; font-size:11.5px; font-weight:700; background:#eef1ee; color:var(--muted); }
  .sst.over { background:#fbe6e2; color:var(--warn); } .sst.same { background:#e2efe5; color:var(--ok); }
  .sst.ai { background:#e1ebf8; color:#2b5d9c; } .sst.edit { background:var(--input); color:#7a6212; }
  .sbtn { display:block; margin:3px 0 0 auto; padding:1px 8px; font-size:11.5px; font-weight:400; }
  .eqrow { display:flex; gap:10px; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line); font-size:12.5px; }
  .eqrow span { color:var(--muted); text-align:right; }
</style>
</head>
<body>

<header>
  <b style="font-size:14px">🖥️ 작성실</b>
  <div class="seg" role="tablist" aria-label="모드">
    <button id="mHome" data-mode="homeroom">담임 모드</button>
    <button id="mSubj" data-mode="subject">교과 모드</button>
  </div>
  <div class="clsbox" id="clsbox"></div>
  <div class="seg" role="tablist" aria-label="보기">
    <button id="vOne" title="학생 한 명을 크게 보고 씁니다">한 명씩</button>
    <button id="vGrid" title="시트처럼 반 전체를 표로 봅니다 — 엑셀에서 복사해 붙여 넣기 · 열 고치기">표</button>
    <button id="vSum" title="활동별 글을 기록 영역(과세특 · 동아리 · 자율 · 진로 · 행발)마다 하나로 모읍니다 — 한도 넘는 학생 압축 · 학생 간 점검 · 나이스 입력 파일">취합 · 나이스</button>
  </div>
  <span class="spacer"></span>
  <span class="save" id="saveState"></span>
  <button id="bSet" title="AI 연결(키 · 모델) · 쓰기 방식 · 학생 명단 — 시트로 가지 않고 이 창에서">⚙ 설정</button>
  <button class="ghost" id="bFit" title="이 창을 지금 화면 크기에 맞춰 다시 엽니다(저장한 뒤)">↔ 화면에 맞게</button>
</header>
<div class="guide" id="guide" hidden></div>
<div class="tabs" id="tabs"></div>

<div class="cols">
  <aside class="left">
    <div class="find"><input type="search" id="q" placeholder="이름 · 번호로 찾기"></div>
    <div class="list" id="list"></div>
    <div class="lfoot" id="lfoot"></div>
  </aside>

  <main class="mid" id="mid"></main>

  <aside class="right">
    <div class="rh">검증 <span class="src" id="vsrc"></span></div>
    <div class="rbody" id="vbody"><div class="iss" style="color:var(--muted)">왼쪽에서 학생을 고르세요.</div></div>
    <div class="rnote">2026 기재요령 금지어 · 어미 · 맞춤법 · 나이스 바이트를 바로 검사합니다. 시트의 [검증] 칸에는 저장할 때 적힙니다.</div>
  </aside>
</div>

<div class="cover" id="cover" hidden><div class="card" id="card"></div></div>
<div class="busy" id="busy" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var CTX = null, MODE = 'subject', CLS = '', ACT = '', STUDENTS = [], DATA = {}, CUR = '', DIRTY = false, SAVING = false;
var vTimer = null;
var VIEW = 'one', GD = {}, gTimer = null;   // 표 보기: GD = 고치고 아직 저장 안 한 학생 id

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
/* 나이스 바이트 — 한글 3, 그 밖 1, 줄바꿈 2 (10_Engine byteLen 과 같음) */
function bytes(s) { s = String(s || ''); var n = 0; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); n += (c === 10 || c === 13) ? 2 : c > 127 ? 3 : 1; } return n; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem('desk.' + k); localStorage.setItem('desk.' + k, v); } catch (e) { return null; } }
function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { el.hidden = true; }, 3500); }
function busy(t) { $('busy').hidden = !t; $('busy').textContent = t || ''; }
function acts() { return (CTX ? CTX.activities : []).filter(function (a) { return a.mode === MODE; }); }
function act() { return acts().filter(function (a) { return a.key === ACT; })[0] || null; }
function rowOf(id, key) { return ((DATA[key || ACT] || {})[id]) || null; }

/* ---------------------------------------------------------- 저장 */
function setSave(t, cls) { $('saveState').textContent = t; $('saveState').className = 'save' + (cls ? ' ' + cls : ''); }
function markDirty() { if (!DIRTY) { DIRTY = true; setSave('● 저장 안 됨', 'dirty'); } }
/** 지금 학생 · 활동을 저장하고 next() — 바뀐 게 없으면 바로 next */
function saveThen(next) {
  if (VIEW === 'grid') { saveGrid(next); return; }
  if (VIEW === 'sum') { saveSum(next); return; }
  if (!DIRTY || !CUR || !act()) { next && next(); return; }
  var r = rowOf(CUR); if (!r) { DIRTY = false; next && next(); return; }
  var inputs = [].map.call(document.querySelectorAll('.in textarea'), function (t) { return t.value; });
  var fin = $('fin') ? $('fin').value : r.final;
  SAVING = true; setSave('저장 중…');
  google.script.run.withSuccessHandler(function (row) {
    SAVING = false; DIRTY = false;
    DATA[ACT][row.id] = row;
    setSave('저장됨 ✓'); drawList();
    next && next();
  }).withFailureHandler(function (e) {
    SAVING = false; setSave('저장 실패', 'err'); toast('⚠ 저장하지 못했습니다: ' + ((e && e.message) || e));
  }).deskSave({ key: ACT, row: r.row, id: r.id, inputs: inputs, final: fin });
}

/* ---------------------------------------------------------- 위 */
function drawHeader() {
  $('mHome').className = MODE === 'homeroom' ? 'on' : '';
  $('mSubj').className = MODE === 'subject' ? 'on' : '';
  var box = $('clsbox');
  if (MODE === 'homeroom') {
    box.innerHTML = CTX.homeroom ? '담임 학반 <b>' + esc(CTX.homeroom) + '</b> <button class="ghost" id="bHr">바꾸기</button>'
                                 : '<button id="bHr">담임 학반 정하기</button>';
    $('bHr').onclick = pickHomeroom;
  } else {
    box.innerHTML = '반 <select id="selCls"><option value="">모든 반</option>' + CTX.classes.map(function (c) {
      return '<option' + (c === CLS ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>';
    $('selCls').onchange = function () { var v = this.value; saveThen(function () { CLS = v; store('cls', v); load(); }); };
  }
  $('tabs').innerHTML = tabsHtml();
  drawGuide(); refreshGuide();
}

function setMode(m) {
  if (m === MODE && STUDENTS.length) return;
  saveThen(function () {
    MODE = m; store('mode', m);
    var list = acts();
    var last = store('act.' + m);
    ACT = list.some(function (a) { return a.key === last; }) ? last : (list[0] ? list[0].key : '');
    CLS = m === 'homeroom' ? (CTX.homeroom || '') : (store('cls') || '');
    if (m === 'subject' && CLS && CTX.classes.indexOf(CLS) < 0) CLS = '';
    drawHeader();
    if (m === 'homeroom' && !CTX.homeroom) { STUDENTS = []; DATA = {}; drawList(); drawMid(); if (CTX.classes.length) pickHomeroom(); return; }
    load();
  });
}

function load() {
  if (!acts().length) { STUDENTS = []; DATA = {}; drawHeader(); drawList(); drawMid(); return; }
  run('deskLoad', { mode: MODE, cls: CLS }, function (res) {
    STUDENTS = res.students; DATA = res.data;
    if (!STUDENTS.some(function (s) { return s.id === CUR; })) CUR = STUDENTS[0] ? STUDENTS[0].id : '';
    drawHeader(); drawList(); drawMid();
  }, '학생 자료를 불러오는 중…');
}

function pickHomeroom() {
  saveThen(function () {
    var h = '<h3>담임 학반을 고르세요</h3><div style="color:var(--muted);font-size:12.5px">담임 모드에서는 이 반 학생만 보입니다. 이 파일에 저장되고, 언제든 바꿀 수 있습니다.</div>';
    h += CTX.classes.length ? '<div class="clsgrid">' + CTX.classes.map(function (c) { return '<button data-c="' + esc(c) + '">' + esc(c) + '반</button>'; }).join('') + '</div>'
                            : '<p>학생 명단이 비어 있습니다. 메뉴 ①②③ > [③ 학생 명단 불러오기]를 먼저 해 주세요.</p>';
    h += '<div style="margin-top:12px;text-align:right">' + (CTX.homeroom ? '<button data-c="">담임 아님(지우기)</button> ' : '') + '<button id="bX">닫기</button></div>';

    [].forEach.call($('card').querySelectorAll('[data-c]'), function (b) {
      b.onclick = function () {
        run('deskSetHomeroom', b.getAttribute('data-c'), function (ctx) {
          CTX = ctx; closeCover(); CLS = ctx.homeroom; drawHeader(); if (MODE === 'homeroom') { if (CLS) load(); else { STUDENTS = []; drawList(); drawMid(); } }
        }, '저장 중…');

function drawList() {
  var q = $('q').value.trim();

  var doneN = 0;
  $('list').innerHTML = shown.map(function (s) {
    var dots = list.map(function (a) {
      var r = rowOf(s.id, a.key);
      var c = r && r.final.trim() ? 'fin' : r && r.ai.trim() && r.ai.indexOf('⚠') !== 0 ? 'ai' : '';
      return '<span class="dot ' + c + (a.key === ACT ? ' cur' : '') + '" title="' + esc(a.name) + (c === 'fin' ? ' · 최종본 있음' : c === 'ai' ? ' · AI 결과만' : ' · 아직') + '"></span>';
    }).join('');

  }).join('') || '<div style="padding:12px;color:var(--muted)">' + (STUDENTS.length ? '찾는 학생이 없습니다.' : '학생이 없습니다.') + '</div>';

}

/** 자료는 있고 AI 결과 · 최종본이 빈 학생을 한꺼번에 */
function genAll() {
  var ids = STUDENTS.map(function (x) { return x.id; }).filter(function (id) {
    var rr = rowOf(id); return rr && !rr.final.trim() && !(rr.ai.trim() && rr.ai.indexOf('⚠') !== 0) && rr.inputs.some(function (v) { return String(v).trim(); });
  });
  if (!ids.length) { toast('자료가 있고 아직 안 쓴 학생이 없습니다.'); return; }
  if (!confirm(ids.length + '명을 씁니다. 계속할까요?')) return;
  generate(ids);
}

function meter() {
  var a = act(); if (!a || !$('fin')) return;
  var b = bytes($('fin').value);
  $('byt').textContent = b + ' / ' + a.limit + ' 바이트 (한글 ' + Math.max(0, Math.floor((a.limit - b) / 3)) + '자 남음)';
  $('bar').className = 'bar' + (b > a.limit ? ' over' : '');
  $('bar').firstChild.style.width = Math.min(100, Math.round(b * 100 / Math.max(1, a.limit))) + '%';
}

function step(d) {
  var q = $('q').value.trim();
  var ids = STUDENTS.filter(function (s) { return !q || (s.name + ' ' + s.no + ' ' + s.cls).indexOf(q) >= 0; }).map(function (s) { return s.id; });
  var i = ids.indexOf(CUR) + d;
  if (i < 0 || i >= ids.length) { toast(d < 0 ? '첫 학생입니다.' : '마지막 학생입니다.'); return; }
  pick(ids[i]);
}

function scrollCur() { var el = document.querySelector('.st.on'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }

/** 엑셀 · 한셀 · 시트에서 복사한 글 → 줄 · 칸. 칸 안 줄바꿈은 따옴표로 싸여 온다("" = 따옴표) */
function parseTsv(t) {
  t = String(t || '').replace(/\r\n?/g, '\n');
  var rows = [], row = [], cell = '', q = false;
  for (var i = 0; i < t.length; i++) {
    var ch = t.charAt(i);
    if (q) { if (ch === '"') { if (t.charAt(i + 1) === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === '') q = true;
    else if (ch === '\t') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function gInsert(t, text, tr) {
  if (t.setRangeText) t.setRangeText(text, t.selectionStart, t.selectionEnd, 'end'); else t.value += text;

}
/** 표 칸에 붙여넣기 — 여러 칸이면 그 칸부터 아래 · 오른쪽으로 채운다(빈 칸은 건너뛰어 있던 글을 지우지 않음) */
function gPaste(e) {
  var t = e.target;
  if (VIEW !== 'grid' || !t || t.tagName !== 'TEXTAREA' || !t.closest('table.grid')) return;
  var text = e.clipboardData ? e.clipboardData.getData('text') : '';
  if (!text) return;
  var rows = parseTsv(text), tr0 = t.closest('tr');
  var width = Math.max.apply(null, rows.map(function (r) { return r.length; }).concat([0]));
  if (rows.length <= 1 && width <= 1) {
    if (rows[0] && rows[0][0] !== text.replace(/\r?\n$/, '')) { e.preventDefault(); gInsert(t, rows[0][0], tr0); }   // 따옴표로 싸인 한 칸
    return;

  var maxC = c0 === 'fin' ? 1 : a.columns.length - (+c0);
  var plan = [], over = 0, people = 0;
  rows.forEach(function (cells, i) {
    var tr = trs[r0 + i]; if (!tr) return;
    var id = tr.getAttribute('data-id'), r = rowOf(id); if (!r) return;
    var any = false;
    for (var j = 0; j < Math.min(cells.length, maxC); j++) {
      if (cells[j] === '') continue;
      var c = c0 === 'fin' ? 'fin' : String(+c0 + j);
      var old = String((c === 'fin' ? r.final : r.inputs[+c]) || '');
      if (old.trim() && old !== cells[j]) over++;
      plan.push({ tr: tr, id: id, c: c, v: cells[j] }); any = true;
    }
    if (any) people++;

  var cutR = Math.max(0, rows.length - (trs.length - r0)), cutC = Math.max(0, width - maxC);
  if (width === 1 || over || cutR || cutC) {
    var msg = '붙여 넣을 자료: ' + rows.length + '줄 × ' + width + '열\n이 칸부터 아래로 ' + people + '명에게 채웁니다.' +
      (over ? '\n· 이미 글이 있는 칸 ' + over + '개는 덮어씁니다.' : '') +
      (cutR ? '\n· 학생보다 많은 ' + cutR + '줄은 버립니다.' : '') +
      (cutC ? '\n· 오른쪽으로 넘치는 ' + cutC + '열은 버립니다(열이 모자라면 [▦ 열 고치기]로 먼저 더하세요).' : '') +
      (width === 1 ? '\n\n[취소]를 누르면 이 칸 하나에 그대로 넣습니다.' : '');
    if (!confirm(msg)) { if (width === 1) gInsert(t, text, tr0); return; }

  plan.forEach(function (p) {

}

  sClick(e);
  if (id === 'bMakeHr') run('deskMakeHomeroomSheets', undefined, function (ctx) {
    CTX = ctx; toast(ctx.made.length ? ctx.made.join(' · ') + ' 시트를 만들었습니다.' : '이미 있습니다.'); MODE = ''; setMode('homeroom');
  }, '시트를 만드는 중…');
  if (id === 'bHr2') pickHomeroom();
  if (id === 'bAddAct') addCover('');
  var gd = e.target.closest && e.target.closest('[data-guide]');
  if (gd) { guideGo(gd.getAttribute('data-guide')); return; }
  if (id === 'bSetRoster') setCover('roster');
  if (id === 'bDemo') run('deskDemo', undefined, function (ctx) {
    CTX = ctx; GUIDE = ctx.guide; store('act.subject', ctx.demoKey); MODE = ''; setMode('subject');
    toast('체험 예시를 넣었습니다. 강하늘 학생의 AI 결과와 오른쪽 검증부터 보세요. 다 보면 위쪽 [🧪 체험 예시 지우기].');
  }, '체험 예시를 넣는 중…');
  if (id === 'bDemoClear') { if (confirm('체험 활동과 가상 학생 3명을 지울까요? 다른 자료는 건드리지 않습니다.')) saveThen(function () {
    run('deskDemoClear', undefined, function (ctx) { CTX = ctx; GUIDE = ctx.guide; MODE = ''; setMode('subject'); toast('체험 예시를 지웠습니다. 이제 실제 명단을 넣으세요.'); }, '지우는 중…'); }); }
  if (id === 'gGen') {
    var ids = gSelected();
    if (!ids.length && CUR && rowOf(CUR)) ids = [CUR];
    if (!ids.length) { toast('맨 왼쪽 체크칸으로 학생을 고르세요.'); return; }
    if (ids.length > 1 && !confirm(ids.length + '명을 씁니다. 계속할까요?')) return;
    generate(ids);
  }
  if (id === 'gGenAll') genAll();
  if (id === 'gTake') gTake();
  if (id === 'gSave') saveThen(function () { toast('저장했습니다.'); });
  if (id === 'gCols') colsCover(false);
  if (id === 'gAdd') colsCover(true);
  if (id === 'gAll') [].forEach.call(document.querySelectorAll('table.grid tbody tr:not([hidden]) .gsel'), function (c) { c.checked = e.target.checked; });
  if (e.target.classList && e.target.classList.contains('hbtn')) colsCover(false, +e.target.getAttribute('data-col'));
});
$('mid').addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'gq') { $('q').value = t.value; gFilter(); return; }
  if (t.id === 'sq') { $('q').value = t.value; sFilter(); return; }
  if (VIEW === 'sum') { var st = t.tagName === 'TEXTAREA' && t.closest('table.sum tr[data-id]'); if (st) { if (st.getAttribute('data-id') !== SCUR) { var so = document.querySelector('table.sum tr.on'); if (so) so.classList.remove('on'); st.classList.add('on'); SCUR = st.getAttribute('data-id'); } sSet(SCUR, t.value, st); } return; }
  if (VIEW !== 'grid' || t.tagName !== 'TEXTAREA') return;
  var tr = t.closest('tr[data-id]');
  if (tr) gSet(tr.getAttribute('data-id'), t.getAttribute('data-c'), t.value, tr);
});
$('mid').addEventListener('focusin', function (e) {
  if (VIEW === 'sum' && e.target.closest) {
    var st = e.target.closest('table.sum tr[data-id]');
    if (!st || st.getAttribute('data-id') === SCUR) return;
    var so = document.querySelector('table.sum tr.on'); if (so) so.classList.remove('on');
    st.classList.add('on'); SCUR = st.getAttribute('data-id'); drawCheck(); return;
  }
  if (VIEW !== 'grid' || !e.target.closest) return;
  var tr = e.target.closest('tr[data-id]');
  if (!tr || tr.getAttribute('data-id') === CUR) return;
  var old = document.querySelector('table.grid tr.on'); if (old) old.classList.remove('on');
  tr.classList.add('on'); CUR = tr.getAttribute('data-id'); drawCheck();
});
$('mid').addEventListener('paste', gPaste);
$('vOne').onclick = function () { setView('one'); };
$('vGrid').onclick = function () { setView('grid'); };
$('vSum').onclick = function () { setView('sum'); };
$('bSet').onclick = function () { setCover('ai'); };
$('bFit').onclick = function () {
  saveThen(function () {
    var w = Math.max(900, (window.screen.availWidth || 1300) - 80), h = Math.max(540, (window.screen.availHeight || 800) - 190);
    busy('창 크기를 맞추는 중…');
    google.script.run.withFailureHandler(function (e) { busy(''); toast('⚠ ' + ((e && e.message) || e)); }).deskOpenSized(w, h);
  });
};
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveThen(function () { toast('저장했습니다.'); }); }
  if (VIEW === 'sum') return;
  if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); VIEW === 'grid' ? gStep(1) : step(1); }
  if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); VIEW === 'grid' ? gStep(-1) : step(-1); }
});
/* 창을 닫기 전에 저장 안 된 글이 있으면 묻는다 */
window.addEventListener('beforeunload', function (e) { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

run('deskContext', undefined, function (ctx) {
  CTX = ctx; GUIDE = ctx.guide || null;
  VIEW = store('view') === 'grid' ? 'grid' : 'one'; drawView();
  var m = store('mode');
  if (m !== 'homeroom' && m !== 'subject') m = ctx.homeroom && ctx.hasHomeroomActs && !ctx.activities.some(function (a) { return a.mode === 'subject'; }) ? 'homeroom' : 'subject';
  MODE = ''; setMode(m);
}, '여는 중…');
/* 서버 부르기 — 끝에 둔다(시험이 창의 서버 호출을 읽는 방식 때문) */
function run(fn, arg, ok, label) {
  if (label) busy(label);
  var r = google.script.run.withSuccessHandler(function (x) { busy(''); ok && ok(x); })
    .withFailureHandler(function (e) { busy(''); toast('⚠ ' + ((e && e.message) || e)); });
  return arg === undefined ? r[fn]() : r[fn](arg);
}
</script>
</body>
