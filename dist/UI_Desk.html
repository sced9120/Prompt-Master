<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root { --line:#dde3dd; --muted:#6b7280; --accent:#35583f; --accent-soft:#e3ece4; --ink:#16202a;
          --warn:#8f2f20; --warn-soft:#f8eae6; --chk:#7a5200; --chk-soft:#fff4d6; --ok:#2c6340; --bg:#f6f8f6;
          --input:#fff8e1; --ai:#eef6ef; --final:#eaf2fb; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; }
  body { color:var(--ink); background:#fff; font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  button { font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:6px 11px; border:1px solid #c9d1c9;
           border-radius:7px; background:#fff; color:var(--ink); }
  button:hover:not(:disabled) { background:var(--bg); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover:not(:disabled) { background:#2b4733; }
  button.ghost { border-color:transparent; background:transparent; }
  button:disabled { opacity:.45; cursor:default; }
  select, input[type=search] { font:inherit; padding:5px 8px; border:1px solid #c9d1c9; border-radius:7px; background:#fff; }
  textarea { width:100%; font:inherit; font-size:13.5px; line-height:1.65; padding:8px 10px; border:1px solid #c9d1c9;
             border-radius:8px; resize:vertical; }
  textarea:focus, select:focus, input:focus { outline:2px solid #9fbfa7; outline-offset:0; }

  /* 위 */
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); flex:none; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid #c9d1c9; border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:6px 14px; }
  .seg button.on { background:var(--accent); color:#fff; }
  .clsbox { display:flex; align-items:center; gap:6px; font-size:12.5px; }
  .clsbox b { color:var(--accent); }
  .spacer { flex:1; }
  .tabs { display:flex; gap:4px; padding:6px 12px 0; border-bottom:1px solid var(--line); flex:none; overflow-x:auto; overflow-y:hidden; }
  .tab { border:1px solid var(--line); border-bottom:0; border-radius:8px 8px 0 0; padding:6px 12px; background:var(--bg);
         font-weight:600; font-size:12.5px; white-space:nowrap; cursor:pointer; }
  .tab.on { background:#fff; color:var(--accent); box-shadow:0 2px 0 #fff; }
  .tab .rec { font-weight:400; color:var(--muted); font-size:11px; margin-left:4px; }

  /* 세 칸 */
  .cols { flex:1; display:grid; grid-template-columns:230px minmax(0,1fr) 290px; min-height:0; }
  .left, .right { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .right { border-right:0; border-left:1px solid var(--line); }
  .left .find { padding:8px; border-bottom:1px solid var(--line); }
  .left .find input { width:100%; }
  .list { overflow:auto; flex:1; }
  .st { display:flex; align-items:center; gap:7px; padding:6px 10px; cursor:pointer; border-bottom:1px solid #f0f2f0; }
  .st:hover { background:var(--bg); }
  .st.on { background:var(--accent-soft); }
  .st .no { width:34px; color:var(--muted); font-size:11.5px; text-align:right; flex:none; }
  .st .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .dots { display:flex; gap:3px; flex:none; }
  .dot { width:8px; height:8px; border-radius:50%; border:1.5px solid #b8c4b9; }
  .dot.ai { background:#cfe3d3; border-color:#8db497; }
  .dot.fin { background:var(--accent); border-color:var(--accent); }
  .dot.cur { outline:2px solid #e7b84c; outline-offset:1px; }
  .lfoot { padding:7px 10px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }

  .mid { overflow:auto; padding:12px 16px 0; min-height:0; }
  .who { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .who h2 { margin:0; font-size:17px; }
  .who .sub { color:var(--muted); font-size:12px; }
  .lab { font-size:12px; font-weight:700; margin:12px 0 4px; display:flex; align-items:center; gap:8px; }
  .lab .hint { font-weight:400; color:var(--muted); font-size:11.5px; }
  .in textarea { background:var(--input); }
  .aibox { background:var(--ai); border:1px solid #cfe0d2; border-radius:8px; padding:8px 10px; white-space:pre-wrap; word-break:keep-all;
           min-height:46px; font-size:13.5px; line-height:1.65; }
  .aibox.empty { color:var(--muted); font-size:12.5px; }
  #fin { background:var(--final); min-height:130px; }
  .meter { display:flex; align-items:center; gap:8px; margin-top:5px; font-size:12px; color:var(--muted); }
  .bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .bar.over i { background:var(--warn); }
  .dock { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); margin:12px -16px 0; padding:8px 16px 10px; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; align-items:center; }
  .save { font-size:12px; color:var(--muted); margin-left:auto; }
  .save.dirty { color:var(--chk); } .save.err { color:var(--warn); }
  .empty-state { max-width:560px; margin:40px auto; text-align:center; color:var(--muted); }
  .empty-state h3 { color:var(--ink); margin:0 0 6px; }
  .empty-state .row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:12px; }

  .right .rh { padding:9px 12px; border-bottom:1px solid var(--line); font-weight:700; display:flex; align-items:center; gap:8px; }
  .right .rh .src { font-weight:400; font-size:11.5px; color:var(--muted); }
  .rbody { overflow:auto; padding:8px 12px; flex:1; }
  .sum { border-radius:7px; padding:7px 10px; font-weight:600; font-size:12.5px; margin-bottom:8px; }
  .sum.ok { background:var(--accent-soft); color:var(--ok); } .sum.bad { background:var(--warn-soft); color:var(--warn); }
  .sum.chk { background:var(--chk-soft); color:var(--chk); }
  .iss { border-bottom:1px solid var(--line); padding:6px 0; font-size:12px; }
  .lv { font-size:10.5px; font-weight:700; border-radius:4px; padding:0 5px; margin-right:4px; }
  .lv.block { background:var(--warn-soft); color:var(--warn); } .lv.check { background:var(--chk-soft); color:var(--chk); }
  .iss .why { color:var(--muted); font-size:11.5px; } .iss .fix { color:var(--ok); font-weight:600; }
  .rnote { font-size:11.5px; color:var(--muted); padding:8px 12px; border-top:1px solid var(--line); }

  /* 키 없이 · 반 고르기 덮개 */
  .cover { position:fixed; inset:0; background:rgba(20,30,24,.35); display:flex; align-items:center; justify-content:center; z-index:5; }
  .card { background:#fff; border-radius:12px; padding:16px 18px; width:min(760px,92vw); max-height:90vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .card h3 { margin:0 0 6px; font-size:15px; }
  .card .mono { font-family:Consolas,"D2Coding",monospace; font-size:12px; background:var(--bg); }
  .clsgrid { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .msg { font-size:12px; min-height:16px; margin-top:6px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--warn); }
  .toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#1e2a24; color:#fff; padding:8px 14px;
           border-radius:8px; font-size:12.5px; z-index:9; max-width:80vw; }
  .busy { position:fixed; inset:0; background:rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; z-index:8;
          font-weight:700; color:var(--accent); }
</style>
</head>
<body>

<header>
  <b style="font-size:14px">🖥️ 작성실</b>
  <div class="seg" role="tablist" aria-label="모드">
    <button id="mHome" data-mode="homeroom">담임 모드</button>
    <button id="mSubj" data-mode="subject">교과 모드</button>
  </div>
  <div class="clsbox" id="clsbox"></div>
  <span class="spacer"></span>
  <span class="save" id="saveState"></span>
  <button class="ghost" id="bFit" title="이 창을 지금 화면 크기에 맞춰 다시 엽니다(저장한 뒤)">↔ 화면에 맞게</button>
</header>
<div class="tabs" id="tabs"></div>

<div class="cols">
  <aside class="left">
    <div class="find"><input type="search" id="q" placeholder="이름 · 번호로 찾기"></div>
    <div class="list" id="list"></div>
    <div class="lfoot" id="lfoot"></div>
  </aside>

  <main class="mid" id="mid"></main>

  <aside class="right">
    <div class="rh">검증 <span class="src" id="vsrc"></span></div>
    <div class="rbody" id="vbody"><div class="iss" style="color:var(--muted)">왼쪽에서 학생을 고르세요.</div></div>
    <div class="rnote">2026 기재요령 금지어 · 어미 · 맞춤법 · 나이스 바이트를 바로 검사합니다. 시트의 [검증] 칸에는 저장할 때 적힙니다.</div>
  </aside>
</div>

<div class="cover" id="cover" hidden><div class="card" id="card"></div></div>
<div class="busy" id="busy" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var CTX = null, MODE = 'subject', CLS = '', ACT = '', STUDENTS = [], DATA = {}, CUR = '', DIRTY = false, SAVING = false;
var vTimer = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
/* 나이스 바이트 — 한글 3, 그 밖 1, 줄바꿈 2 (10_Engine byteLen 과 같음) */
function bytes(s) { s = String(s || ''); var n = 0; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); n += (c === 10 || c === 13) ? 2 : c > 127 ? 3 : 1; } return n; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem('desk.' + k); localStorage.setItem('desk.' + k, v); } catch (e) { return null; } }
function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { el.hidden = true; }, 3500); }
function busy(t) { $('busy').hidden = !t; $('busy').textContent = t || ''; }
function acts() { return (CTX ? CTX.activities : []).filter(function (a) { return a.mode === MODE; }); }
function act() { return acts().filter(function (a) { return a.key === ACT; })[0] || null; }
function rowOf(id, key) { return ((DATA[key || ACT] || {})[id]) || null; }

/* ---------------------------------------------------------- 저장 */
function setSave(t, cls) { $('saveState').textContent = t; $('saveState').className = 'save' + (cls ? ' ' + cls : ''); }
function markDirty() { if (!DIRTY) { DIRTY = true; setSave('● 저장 안 됨', 'dirty'); } }
/** 지금 학생 · 활동을 저장하고 next() — 바뀐 게 없으면 바로 next */
function saveThen(next) {
  if (!DIRTY || !CUR || !act()) { next && next(); return; }
  var r = rowOf(CUR); if (!r) { DIRTY = false; next && next(); return; }
  var inputs = [].map.call(document.querySelectorAll('.in textarea'), function (t) { return t.value; });
  var fin = $('fin') ? $('fin').value : r.final;
  SAVING = true; setSave('저장 중…');
  google.script.run.withSuccessHandler(function (row) {
    SAVING = false; DIRTY = false;
    DATA[ACT][row.id] = row;
    setSave('저장됨 ✓'); drawList();
    next && next();
  }).withFailureHandler(function (e) {
    SAVING = false; setSave('저장 실패', 'err'); toast('⚠ 저장하지 못했습니다: ' + ((e && e.message) || e));
  }).deskSave({ key: ACT, row: r.row, id: r.id, inputs: inputs, final: fin });
}

/* ---------------------------------------------------------- 위 */
function drawHeader() {
  $('mHome').className = MODE === 'homeroom' ? 'on' : '';
  $('mSubj').className = MODE === 'subject' ? 'on' : '';
  var box = $('clsbox');
  if (MODE === 'homeroom') {
    box.innerHTML = CTX.homeroom ? '담임 학반 <b>' + esc(CTX.homeroom) + '</b> <button class="ghost" id="bHr">바꾸기</button>'
                                 : '<button id="bHr">담임 학반 정하기</button>';
    $('bHr').onclick = pickHomeroom;
  } else {
    box.innerHTML = '반 <select id="selCls"><option value="">모든 반</option>' + CTX.classes.map(function (c) {
      return '<option' + (c === CLS ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>';
    $('selCls').onchange = function () { var v = this.value; saveThen(function () { CLS = v; store('cls', v); load(); }); };
  }
  var list = acts();
  $('tabs').innerHTML = list.map(function (a) {
    return '<div class="tab' + (a.key === ACT ? ' on' : '') + '" data-k="' + esc(a.key) + '">' + esc(a.name) + '<span class="rec">' + esc(a.rec) + '</span></div>';
  }).join('') || '<div class="tab on" style="color:var(--muted)">활동 없음</div>';
}

function setMode(m) {
  if (m === MODE && STUDENTS.length) return;
  saveThen(function () {
    MODE = m; store('mode', m);
    var list = acts();
    var last = store('act.' + m);
    ACT = list.some(function (a) { return a.key === last; }) ? last : (list[0] ? list[0].key : '');
    CLS = m === 'homeroom' ? (CTX.homeroom || '') : (store('cls') || '');
    if (m === 'subject' && CLS && CTX.classes.indexOf(CLS) < 0) CLS = '';
    drawHeader();
    if (m === 'homeroom' && !CTX.homeroom) { STUDENTS = []; DATA = {}; drawList(); drawMid(); if (CTX.classes.length) pickHomeroom(); return; }
    load();
  });
}

function load() {
  if (!acts().length) { STUDENTS = []; DATA = {}; drawHeader(); drawList(); drawMid(); return; }
  run('deskLoad', { mode: MODE, cls: CLS }, function (res) {
    STUDENTS = res.students; DATA = res.data;
    if (!STUDENTS.some(function (s) { return s.id === CUR; })) CUR = STUDENTS[0] ? STUDENTS[0].id : '';
    drawHeader(); drawList(); drawMid();
  }, '학생 자료를 불러오는 중…');
}

function pickHomeroom() {
  saveThen(function () {
    var h = '<h3>담임 학반을 고르세요</h3><div style="color:var(--muted);font-size:12.5px">담임 모드에서는 이 반 학생만 보입니다. 이 파일에 저장되고, 언제든 바꿀 수 있습니다.</div>';
    h += CTX.classes.length ? '<div class="clsgrid">' + CTX.classes.map(function (c) { return '<button data-c="' + esc(c) + '">' + esc(c) + '반</button>'; }).join('') + '</div>'
                            : '<p>학생 명단이 비어 있습니다. 메뉴 ①②③ > [③ 학생 명단 불러오기]를 먼저 해 주세요.</p>';
    h += '<div style="margin-top:12px;text-align:right">' + (CTX.homeroom ? '<button data-c="">담임 아님(지우기)</button> ' : '') + '<button id="bX">닫기</button></div>';
    openCover(h);
    $('bX').onclick = closeCover;
    [].forEach.call($('card').querySelectorAll('[data-c]'), function (b) {
      b.onclick = function () {
        run('deskSetHomeroom', b.getAttribute('data-c'), function (ctx) {
          CTX = ctx; closeCover(); CLS = ctx.homeroom; drawHeader(); if (MODE === 'homeroom') { if (CLS) load(); else { STUDENTS = []; drawList(); drawMid(); } }
        }, '저장 중…');
      };
    });
  });
}

/* ---------------------------------------------------------- 왼쪽 */
function drawList() {
  var q = $('q').value.trim();
  var list = acts();
  var shown = STUDENTS.filter(function (s) { return !q || (s.name + ' ' + s.no + ' ' + s.cls).indexOf(q) >= 0; });
  var doneN = 0;
  $('list').innerHTML = shown.map(function (s) {
    var dots = list.map(function (a) {
      var r = rowOf(s.id, a.key);
      var c = r && r.final.trim() ? 'fin' : r && r.ai.trim() && r.ai.indexOf('⚠') !== 0 ? 'ai' : '';
      return '<span class="dot ' + c + (a.key === ACT ? ' cur' : '') + '" title="' + esc(a.name) + (c === 'fin' ? ' · 최종본 있음' : c === 'ai' ? ' · AI 결과만' : ' · 아직') + '"></span>';
    }).join('');
    var r0 = rowOf(s.id); if (r0 && r0.final.trim()) doneN++;
    return '<div class="st' + (s.id === CUR ? ' on' : '') + '" data-id="' + esc(s.id) + '"><span class="no">' + esc((CLS ? '' : s.cls + '-') + s.no) + '</span>' +
           '<span class="nm">' + esc(s.name || '(이름 없음)') + '</span><span class="dots">' + dots + '</span></div>';
  }).join('') || '<div style="padding:12px;color:var(--muted)">' + (STUDENTS.length ? '찾는 학생이 없습니다.' : '학생이 없습니다.') + '</div>';
  var a = act();
  $('lfoot').textContent = a ? a.name + ' 최종본 ' + doneN + ' / ' + STUDENTS.length + '명' : '';
}

/* ---------------------------------------------------------- 가운데 */
function emptyMid(h) { $('mid').innerHTML = '<div class="empty-state">' + h + '</div>'; drawCheck(); }

function drawMid() {
  if (!CTX) return;
  if (!CTX.activities.length || !acts().length) {
    if (MODE === 'homeroom') return emptyMid('<h3>담임 활동이 아직 없습니다</h3>자율 · 진로 · 행동특성 세 시트를 <b>바로 쓰기</b> 모양(학생마다 관찰 메모 한 칸)으로 한 번에 만들 수 있습니다.' +
      '<div class="row"><button class="primary" id="bMakeHr">자율 · 진로 · 행발 시트 만들기</button></div>');
    return emptyMid('<h3>교과 활동이 아직 없습니다</h3>과목 세특 · 동아리 활동은 활동 만들기에서 입력 항목과 함께 만듭니다(이 창은 닫힙니다).' +
      '<div class="row"><button class="primary" id="bWizard">④ 활동 만들기 열기</button><button id="bQuick">✍️ 바로 쓰기 시트 만들기</button></div>');
  }
  if (MODE === 'homeroom' && !CTX.homeroom) return emptyMid('<h3>담임 학반을 먼저 정하세요</h3><div class="row"><button class="primary" id="bHr2">담임 학반 정하기</button></div>');
  if (!STUDENTS.length) return emptyMid('<h3>학생이 없습니다</h3>메뉴 ①②③ > [③ 학생 명단 불러오기] 뒤 [학생 명단 동기화]를 눌러 주세요.');
  var a = act(), s = STUDENTS.filter(function (x) { return x.id === CUR; })[0];
  if (!a || !s) return emptyMid('왼쪽에서 학생을 고르세요.');
  var r = rowOf(s.id);
  var h = '<div class="who"><h2>' + esc(s.name || '(이름 없음)') + '</h2><span class="sub">' + esc(s.cls) + '반 ' + esc(s.no) + '번 · ' +
          esc(a.name) + ' (' + esc(a.rec) + ' · ' + a.limit + '바이트)</span></div>';
  if (!r) {
    $('mid').innerHTML = h + '<div class="empty-state">이 학생 줄이 [' + esc(a.name) + '] 시트에 없습니다.<br>메뉴 ①②③ > [학생 명단 동기화]를 누른 뒤 다시 열어 주세요.</div>';
    drawCheck(); return;
  }
  h += '<div class="in">' + a.columns.map(function (c, i) {
    return '<div class="lab">' + esc(c) + (i === 0 ? '<span class="hint">학생 자료 — 관찰한 것 · 산출물 · 발언</span>' : '') + '</div>' +
           '<textarea rows="' + (a.quick ? 4 : 2) + '" data-i="' + i + '">' + esc(r.inputs[i] || '') + '</textarea>';
  }).join('') + '</div>';
  var hasAi = r.ai.trim() && r.ai.indexOf('=') !== 0;
  h += '<div class="lab">AI 결과 <span class="hint">AI가 쓴 초안 — 그대로 쓰지 말고 다듬어 최종본에</span>' +
       (hasAi && r.ai.indexOf('⚠') !== 0 ? '<button id="bTake" style="margin-left:auto">↓ 최종본으로 옮기기</button>' : '') + '</div>' +
       '<div class="aibox' + (hasAi ? '' : ' empty') + '">' + (hasAi ? esc(r.ai) : r.ai.indexOf('=') === 0 ? 'Gemini 구독 수식이 들어 있습니다 — 시트에서 그 칸을 고르고 [생성 및 삽입]을 누르세요.' : '아직 없습니다. 아래 [✨ AI로 쓰기]를 누르세요.') + '</div>';
  h += '<div class="lab">최종본 <span class="hint">나이스에 들어갈 글 — 여기 쓴 것만 최종취합 · 나이스 업로드에 쓰입니다</span></div>' +
       '<textarea id="fin" rows="6">' + esc(r.final) + '</textarea>';
  h += '<div class="dock"><div class="meter" style="margin-top:0"><span id="byt"></span><div class="bar" id="bar"><i></i></div></div><div class="acts">' +
       '<button class="primary" id="bGen">✨ AI로 쓰기</button>' +
       '<button id="bGenAll" title="이 활동에서 자료는 있고 AI 결과 · 최종본이 빈 학생을 한꺼번에">아직 안 쓴 학생 모두</button>' +
       '<button id="bSave">💾 저장</button>' +
       '<span class="spacer"></span>' +
       '<button id="bPrev" title="Alt+↑">◀ 이전</button><button id="bNext" title="Alt+↓">다음 ▶</button></div>';
  if (!CTX.consent) h += '<div class="msg err" style="margin-top:4px">🔒 AI로 쓰기 전에 메뉴 ①②③ > [개인정보 · 보안 안내와 동의]를 한 번 해 주세요(검사 · 저장은 지금도 됩니다).</div>';
  else if (CTX.manualOnly) h += '<div class="msg" style="color:var(--muted);margin-top:4px">AI 키가 없어 [✨ AI로 쓰기]는 복사 · 붙여넣기로 진행합니다.</div>';
  h += '</div>';
  $('mid').innerHTML = h;
  meter(); drawCheck();
  [].forEach.call(document.querySelectorAll('.in textarea'), function (t) { t.oninput = markDirty; });
  $('fin').oninput = function () { markDirty(); meter(); queueCheck(); };
  if ($('bTake')) $('bTake').onclick = function () {
    if ($('fin').value.trim() && !confirm('최종본에 쓴 글을 AI 결과로 바꿀까요?')) return;
    $('fin').value = r.ai; markDirty(); meter(); queueCheck(); $('fin').focus();
  };
  $('bSave').onclick = function () { saveThen(function () { toast('저장했습니다.'); }); };
  $('bPrev').onclick = function () { step(-1); };
  $('bNext').onclick = function () { step(1); };
  $('bGen').onclick = function () { generate([s.id]); };
  $('bGenAll').onclick = function () {
    var ids = STUDENTS.map(function (x) { return x.id; }).filter(function (id) {
      var rr = rowOf(id); return rr && !rr.final.trim() && !(rr.ai.trim() && rr.ai.indexOf('⚠') !== 0) && rr.inputs.some(function (v) { return String(v).trim(); });
    });
    if (!ids.length) { toast('자료가 있고 아직 안 쓴 학생이 없습니다.'); return; }
    if (!confirm(ids.length + '명을 씁니다. 계속할까요?')) return;
    generate(ids);
  };
}

function meter() {
  var a = act(); if (!a || !$('fin')) return;
  var b = bytes($('fin').value);
  $('byt').textContent = b + ' / ' + a.limit + ' 바이트 (한글 ' + Math.max(0, Math.floor((a.limit - b) / 3)) + '자 남음)';
  $('bar').className = 'bar' + (b > a.limit ? ' over' : '');
  $('bar').firstChild.style.width = Math.min(100, Math.round(b * 100 / Math.max(1, a.limit))) + '%';
}

function step(d) {
  var q = $('q').value.trim();
  var ids = STUDENTS.filter(function (s) { return !q || (s.name + ' ' + s.no + ' ' + s.cls).indexOf(q) >= 0; }).map(function (s) { return s.id; });
  var i = ids.indexOf(CUR) + d;
  if (i < 0 || i >= ids.length) { toast(d < 0 ? '첫 학생입니다.' : '마지막 학생입니다.'); return; }
  pick(ids[i]);
}
function pick(id) { if (id === CUR) return; saveThen(function () { CUR = id; DIRTY = false; setSave(''); drawList(); drawMid(); scrollCur(); }); }
function scrollCur() { var el = document.querySelector('.st.on'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }

/* ---------------------------------------------------------- AI 로 쓰기 */
function generate(ids) {
  if (!CTX.consent) { toast('🔒 먼저 메뉴에서 개인정보 · 보안 안내에 동의해 주세요.'); return; }
  saveThen(function () {
    var rows = ids.map(function (id) { return (rowOf(id) || {}).row; });
    run('deskGenerate', { key: ACT, ids: ids, rows: rows }, function (res) {
      if (res.consent === false) { toast('🔒 먼저 메뉴에서 개인정보 · 보안 안내에 동의해 주세요.'); return; }
      if (res.manual) { manualCover(res.manual, res.empty); return; }
      (res.rows || []).forEach(function (row) { DATA[ACT][row.id] = row; });
      drawList(); drawMid();
      var d = res.done || {};
      var t = (res.rows || []).length ? '완료 ' + (d.ok || 0) + '명' : '';
      if (d.left) t += ' · 시간 제한으로 ' + d.left + '명 남음(다시 누르세요)';
      if (res.empty) t += (t ? ' · ' : '') + '자료가 빈 학생 ' + res.empty + '명은 건너뜀';
      if (d.busy) t = '다른 생성이 돌고 있습니다. 끝난 뒤 다시 누르세요.';
      toast(t || '쓸 학생이 없습니다.');
    }, ids.length > 1 ? ids.length + '명 쓰는 중… (몇 분 걸릴 수 있어요)' : 'AI가 쓰는 중…');
  });
}

/* 키 없이 — 요청문 복사 → 답 붙여넣기 (이 창 안에서) */
function manualCover(M, empty) {
  var idx = 0;
  function full(c) { return M.system + '\n\n' + c.user; }
  function draw() {
    var c = M.chunks[idx];
    openCover('<h3>📋 키 없이 쓰기 — ' + esc(M.title) + (M.chunks.length > 1 ? ' · 묶음 ' + (idx + 1) + '/' + M.chunks.length : '') + '</h3>' +
      '<div style="font-size:12.5px;color:var(--muted)">① 요청문을 복사해 <a href="https://gemini.google.com/app" target="_blank">Gemini</a>(학교 계정 권장) · ChatGPT · Claude 대화창에 붙여 넣고 → ② 받은 답을 아래에 붙여 넣으세요. ' +
      (M.masked ? '학생 이름은 S1, S2 … 로 바뀌어 들어갑니다.' : '⚠ 이름 마스킹이 꺼져 있어 이름이 들어갑니다.') + (empty ? ' (자료가 빈 학생 ' + empty + '명은 뺐습니다)' : '') + '</div>' +
      '<div style="margin-top:6px;font-size:12px">' + c.labels.map(function (l, i) { return esc(c.ids[i] + ' = ' + l); }).join(' · ') + '</div>' +
      '<div class="lab">① 요청문 <button id="mCopy" class="primary" style="margin-left:auto">복사</button></div>' +
      '<textarea id="mPrompt" class="mono" rows="7" readonly></textarea>' +
      '<div class="lab">② 받은 답</div><textarea id="mAns" rows="7" placeholder="AI 답을 통째로 붙여 넣으세요"></textarea>' +
      '<div class="msg" id="mMsg"></div>' +
      '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px"><button id="mClose">닫기</button><button class="primary" id="mApply">③ 넣기</button></div>');
    $('mPrompt').value = full(c);
    $('mCopy').onclick = function () {
      var ta = $('mPrompt'); ta.focus(); ta.select(); var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      $('mMsg').textContent = ok ? '✓ 복사했습니다. 대화창에 붙여 넣으세요(Ctrl+V).' : '위 칸을 누르고 Ctrl+A → Ctrl+C 하세요.';
      $('mMsg').className = 'msg ' + (ok ? 'ok' : 'err');
    };
    $('mClose').onclick = closeCover;
    $('mApply').onclick = function () {
      var ans = $('mAns').value.trim(); if (!ans) { $('mMsg').textContent = '답을 붙여 넣으세요.'; $('mMsg').className = 'msg err'; return; }
      this.disabled = true;
      google.script.run.withSuccessHandler(function (r) {
        run('deskRows', { key: ACT, rows: c.rows }, function (rows) {
          rows.forEach(function (row) { DATA[ACT][row.id] = row; });
          drawList(); drawMid();
          var t = r.written + '명을 [AI 결과]에 넣었습니다.' + (r.missing.length ? ' 빠진 학생: ' + r.missing.join(', ') : '');
          if (idx + 1 < M.chunks.length) { idx++; draw(); toast(t + ' 다음 묶음으로 넘어갑니다.'); }
          else { closeCover(); toast(t + ' 읽고 다듬어 최종본에 옮기세요.'); }
        });
      }).withFailureHandler(function (e) { $('mApply').disabled = false; $('mMsg').textContent = (e && e.message) || e; $('mMsg').className = 'msg err'; })
        .manualApply({ sheet: M.sheet, target: M.target, check: M.check, limit: M.limit, rows: c.rows, ids: c.ids, labels: c.labels, answer: ans });
    };
  }
  draw();
}

function openCover(h) { $('card').innerHTML = h; $('cover').hidden = false; }
function closeCover() { $('cover').hidden = true; $('card').innerHTML = ''; }

/* ---------------------------------------------------------- 오른쪽 검증 */
function queueCheck() { clearTimeout(vTimer); vTimer = setTimeout(drawCheck, 900); }
function drawCheck() {
  var r = CUR && rowOf(CUR);
  if (!r || !act()) { $('vsrc').textContent = ''; $('vbody').innerHTML = '<div class="iss" style="color:var(--muted)">왼쪽에서 학생을 고르세요.</div>'; return; }
  var fin = $('fin') ? $('fin').value : r.final;
  var text = fin.trim() ? fin : (r.ai.indexOf('⚠') === 0 || r.ai.indexOf('=') === 0 ? '' : r.ai);
  $('vsrc').textContent = fin.trim() ? '최종본 기준' : text ? 'AI 결과 기준' : '';
  if (!text.trim()) { $('vbody').innerHTML = '<div class="iss" style="color:var(--muted)">검사할 글이 아직 없습니다.</div>'; return; }
  var mine = ++drawCheck.n;
  google.script.run.withSuccessHandler(function (v) {
    if (mine !== drawCheck.n) return;   // 그사이 다른 글을 검사했으면 버린다
    var block = v.issues.filter(function (x) { return x.level === 'block'; }).length;
    var h = '<div class="sum ' + (block ? 'bad' : v.issues.length ? 'chk' : 'ok') + '">' +
            (block ? '수정 필요 ' + block + '곳' : v.issues.length ? '확인 ' + v.issues.length + '곳' : '통과') + ' · ' + v.bytes + ' / ' + v.limit + '바이트</div>';
    h += v.issues.map(function (x) {
      return '<div class="iss"><span class="lv ' + x.level + '">' + (x.level === 'block' ? '수정' : '확인') + '</span>' + esc(x.label) +
             (x.hit ? ' → <b>' + esc(x.hit) + '</b>' : '') + (x.fix ? '<div class="fix">바르게: ' + esc(x.fix) + '</div>' : '') +
             (x.why ? '<div class="why">' + esc(x.why) + '</div>' : '') + '</div>';
    }).join('');
    $('vbody').innerHTML = h;
  }).withFailureHandler(function () {}).deskInspect({ key: ACT, text: text });
}
drawCheck.n = 0;

/* ---------------------------------------------------------- 이벤트 */
$('mHome').onclick = function () { setMode('homeroom'); };
$('mSubj').onclick = function () { setMode('subject'); };
$('q').oninput = drawList;
$('tabs').onclick = function (e) {
  var t = e.target.closest('.tab[data-k]'); if (!t) return;
  var k = t.getAttribute('data-k'); if (k === ACT) return;
  saveThen(function () { ACT = k; store('act.' + MODE, k); DIRTY = false; setSave(''); drawHeader(); drawList(); drawMid(); });
};
$('list').onclick = function (e) { var el = e.target.closest('.st'); if (el) pick(el.getAttribute('data-id')); };
$('mid').addEventListener('click', function (e) {
  var id = e.target.id;
  if (id === 'bMakeHr') run('deskMakeHomeroomSheets', undefined, function (ctx) {
    CTX = ctx; toast(ctx.made.length ? ctx.made.join(' · ') + ' 시트를 만들었습니다.' : '이미 있습니다.'); MODE = ''; setMode('homeroom');
  }, '시트를 만드는 중…');
  if (id === 'bHr2') pickHomeroom();
  if (id === 'bWizard') google.script.run.homeRun('wizard');
  if (id === 'bQuick') google.script.run.homeRun('quick');
});
$('bFit').onclick = function () {
  saveThen(function () {
    var w = Math.max(900, (window.screen.availWidth || 1300) - 80), h = Math.max(540, (window.screen.availHeight || 800) - 190);
    busy('창 크기를 맞추는 중…');
    google.script.run.withFailureHandler(function (e) { busy(''); toast('⚠ ' + ((e && e.message) || e)); }).deskOpenSized(w, h);
  });
};
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveThen(function () { toast('저장했습니다.'); }); }
  if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
});
/* 창을 닫기 전에 저장 안 된 글이 있으면 묻는다 */
window.addEventListener('beforeunload', function (e) { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

run('deskContext', undefined, function (ctx) {
  CTX = ctx;
  var m = store('mode');
  if (m !== 'homeroom' && m !== 'subject') m = ctx.homeroom && ctx.hasHomeroomActs && !ctx.activities.some(function (a) { return a.mode === 'subject'; }) ? 'homeroom' : 'subject';
  MODE = ''; setMode(m);
}, '여는 중…');
/* 서버 부르기 — 끝에 둔다(시험이 창의 서버 호출을 읽는 방식 때문) */
function run(fn, arg, ok, label) {
  if (label) busy(label);
  var r = google.script.run.withSuccessHandler(function (x) { busy(''); ok && ok(x); })
    .withFailureHandler(function (e) { busy(''); toast('⚠ ' + ((e && e.message) || e)); });
  return arg === undefined ? r[fn]() : r[fn](arg);
}
</script>
</body>
</html>
