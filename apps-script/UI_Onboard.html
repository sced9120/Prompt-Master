<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root { --line:#dde3dd; --muted:#6b7280; --accent:#35583f; --accent-soft:#e3ece4;
          --warn:#8f2f20; --warn-soft:#f8eae6; --ok:#2c6340; --bg:#f6f8f6; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:18px; color:#16202a;
         font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; }
  h2 { margin:0 0 2px; font-size:17px; }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:16px; }

  .step { border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:#fff; overflow:hidden; }
  .step.active { border-color:var(--accent); box-shadow:0 1px 6px rgba(53,88,63,.10); }
  .step.done .head { background:var(--accent-soft); }
  .head { display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer; }
  .num { flex:none; width:22px; height:22px; border-radius:50%; background:var(--line); color:#4b5563;
         font-size:11px; font-weight:600; line-height:22px; text-align:center; }
  .step.active .num { background:var(--accent); color:#fff; }
  .step.done .num { background:var(--ok); color:#fff; }
  .title { flex:1; font-weight:600; font-size:13.5px; }
  .chip { font-size:11px; color:var(--muted); }
  .step.done .chip { color:var(--ok); font-weight:600; }
  .body { padding:2px 14px 16px 46px; display:none; }
  .step.active .body { display:block; }

  label { display:block; font-size:12px; font-weight:600; color:#374151; margin:10px 0 4px; }
  input, select, textarea {
    width:100%; padding:8px 10px; border:1px solid #c9d1c9; border-radius:6px; font:inherit; background:#fff; }
  textarea { resize:vertical; font-size:13px; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  .note { font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.55; }
  .warn { background:var(--warn-soft); border-radius:7px; padding:10px 12px; font-size:12.5px;
          color:#6b2417; margin:10px 0; line-height:1.6; }
  .warn b { color:var(--warn); }
  .box { border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:12.5px; background:#fafbfa; }

  button { font:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:8px 15px;
           border:1px solid #c9d1c9; border-radius:6px; background:#fff; color:#16202a; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.55; cursor:default; }
  .actions { display:flex; gap:7px; margin-top:13px; flex-wrap:wrap; align-items:center; }

  .msg { font-size:12.5px; margin-top:9px; min-height:16px; }
  .msg.err { color:var(--warn); } .msg.ok { color:var(--ok); }
  .spin { display:inline-block; width:11px; height:11px; border:2px solid #ccd; border-top-color:var(--accent);
          border-radius:50%; animation:sp .8s linear infinite; vertical-align:-1px; margin-right:5px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .result { background:var(--bg); border:1px solid var(--line); border-radius:7px;
            padding:11px 13px; margin-top:11px; font-size:13px; line-height:1.7; }
  .meta { font-size:11.5px; color:var(--muted); margin-top:7px; }
  .ways { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .way { display:flex; gap:9px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:9px 11px;
         font-weight:400; margin:0; cursor:pointer; }
  .way input { width:auto; margin:4px 0 0; }
  .way.on { border-color:var(--accent); background:var(--accent-soft); }
  .way .t { font-weight:600; font-size:13px; color:#16202a; }
  .way .d { font-size:11.5px; color:var(--muted); }
  code { background:#eef2ee; padding:0 4px; border-radius:4px; font-size:12px; }
  .done-box { text-align:center; padding:6px 0 2px; }
  .done-box .big { font-size:15px; font-weight:600; color:var(--ok); margin-bottom:6px; }
  .acct { font-size:12px; background:#eef4fb; color:#1f3f66; border-radius:7px; padding:7px 10px; margin:2px 0 8px; }
  .rec { font-size:10.5px; font-weight:700; color:#fff; background:var(--accent); border-radius:4px; padding:0 6px; margin-left:4px; }
  .upd { display:flex; gap:10px; align-items:center; justify-content:space-between; background:#e8f3ec; border:1px solid #b9d6c2;
         border-radius:8px; padding:8px 12px; margin:-6px 0 12px; font-size:12.5px; color:#1b3a2a; }
  .upd button { padding:5px 11px; font-size:12px; }
  .demo { display:flex; gap:10px; align-items:center; justify-content:space-between; border:1px dashed #b9c6bb; border-radius:8px;
          padding:8px 12px; margin:-6px 0 12px; font-size:12.5px; background:#fafcfa; color:#30403a; }
  .demo button { padding:5px 11px; font-size:12px; flex:none; }
  .old { border:1px dashed #b9c6bb; border-radius:8px; padding:9px 12px; margin-top:12px; font-size:12.5px; background:#fafcfa; }
  .ainote { font-size:11.5px; color:#7f1d1d; background:#fdecea; border-radius:7px; padding:7px 10px; margin-top:10px; line-height:1.55; }
  textarea.mono { font:11.5px/1.5 ui-monospace,Consolas,monospace; background:#fafbfa; color:#374151; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
</head>
<body>

<h2>시작하기</h2>
<div class="sub">순서대로 따라가면 첫 세특이 나오는 것까지 확인할 수 있습니다. 중간에 닫아도 다시 열면 이어집니다.</div>

<div id="upd"></div>
<div id="demo"></div>
<div id="steps"></div>
<div class="msg" id="globalMsg"></div>
<div class="ainote" id="aiNote"></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var LABEL = { gemini: 'Gemini', openai: 'OpenAI', anthropic: 'Claude' };
var ST = null, CTX = null, ACT = null, OPEN;   // undefined = 아직 안 정함, null = 사용자가 접음

var STEPS = [
  { key:'install', title:'구조 설치', render:renderInstall, isDone:function(s){ return s.installed; } },
  { key:'ai',      title:'AI 연결 — API 키 또는 키 없이', render:renderAi, isDone:function(s){ return s.hasKey || s.subscription || s.manual; } },
  { key:'roster',  title:'학생 명단', render:renderRoster,  isDone:function(s){ return s.rosterCount > 0; } },
  { key:'act',     title:'첫 활동 만들기', render:renderAct, isDone:function(s){ return s.activities.length > 0; } },
  { key:'test',    title:'시험 생성', render:renderTest,    isDone:function(s){ return s.done; } }
];

function busy(el, on, text) {
  el.disabled = on;
  if (on) { el.dataset.label = el.textContent; el.innerHTML = '<span class="spin"></span>' + (text || '진행 중'); }
  else if (el.dataset.label) { el.textContent = el.dataset.label; }
}
function say(id, msg, cls) { var e = $(id); e.className = 'msg ' + (cls || ''); e.textContent = msg || ''; }

function load(cb) {
  google.script.run
    .withSuccessHandler(function (s) { ST = s; draw(); drawUpdate(); drawDemo(); if (s.aiNotice) $('aiNote').textContent = '⚠️ ' + s.aiNotice; if (cb) cb(s); })
    .withFailureHandler(function (e) { say('globalMsg', e.message, 'err'); })
    .onboardStatus();
}

/** 새 버전 알림 줄 (하루 한 번 받아 둔 정보로) */
function drawUpdate() {
  var u = ST && ST.update;
  if (!u || !u.available) { $('upd').innerHTML = ''; return; }
  $('upd').innerHTML = '<div class="upd"><span>🔄 새 버전 <b>' + esc(u.latest) + '</b> 이(가) 나왔습니다 (지금 ' + esc(u.current) + ').</span>' +
    '<button id="bUpd">무엇이 바뀌었나 · 옮기는 법</button></div>';
  $('bUpd').onclick = function () { google.script.run.openUpdateDialog('version'); };
}

/** 체험 예시 줄 — 비어 있는 사본이면 채우기, 채웠으면 지우기(두 번 눌러야 지움) */
var DEMO_MSG = '';
function drawDemo() {
  var d = ST && ST.demo, box = $('demo');
  var note = DEMO_MSG ? '<div class="msg ok" style="margin:-6px 0 12px">' + esc(DEMO_MSG) + '</div>' : '';
  if (!d || (!d.filled && !d.canFill)) { box.innerHTML = note; return; }
  box.innerHTML = d.filled
    ? '<div class="demo"><span>체험 예시가 들어 있습니다 · <b>' + esc(d.inSheet) + '</b> 시트. 다 보셨으면 지우고 내 학생으로 시작하세요.</span>' +
      '<button id="bDemo">체험 예시 지우기</button></div>'
    : '<div class="demo"><span>처음이면 <b>체험 예시</b>로 먼저 둘러보세요. 가상 학생 3명(관찰 메모 양이 서로 다름), 바로 쓰기 활동 하나, 예시 2편, 검사 결과가 보이는 초안 한 편을 넣습니다.</span>' +
      '<button id="bDemo">체험 예시로 채워 보기</button></div>';
  box.innerHTML += note;
  var b = $('bDemo'), armed = false;
  b.onclick = function () {
    if (d.filled && !armed) { armed = true; b.textContent = '한 번 더 누르면 지웁니다'; return; }
    busy(b, true, d.filled ? '지우는 중' : '채우는 중');
    google.script.run
      .withSuccessHandler(function (r) {
        DEMO_MSG = d.filled ? '체험 예시를 지웠습니다 (시트 ' + r.sheets.length + '개 · 체험 학생 ' + r.students + '명).'
                            : '체험 예시를 넣었습니다 → [' + r.inSheet + ']. 강하늘 줄의 [검증] 칸부터 보세요. 윤바다(메모 세 줄)와 서가람(한 줄)은 [생성]을 체크하고 메뉴 ⑥으로 초안을 받아 메모 양에 따라 결과가 어떻게 달라지는지 보세요.';
        load();
      })
      .withFailureHandler(function (e) { busy(b, false); say('globalMsg', e.message, 'err'); })
      [d.filled ? 'demoClear' : 'demoFill']();
  };
}

function draw() {
  var box = $('steps');
  box.textContent = '';
  var firstOpen = null;
  STEPS.forEach(function (st, i) {
    var done = st.isDone(ST);
    if (!done && firstOpen === null) firstOpen = st.key;
  });
  if (OPEN === undefined) OPEN = firstOpen || 'test';

  STEPS.forEach(function (st, i) {
    var done = st.isDone(ST);
    var el = document.createElement('div');
    el.className = 'step' + (done ? ' done' : '') + (OPEN === st.key ? ' active' : '');

    var head = document.createElement('div');
    head.className = 'head';
    head.onclick = function () { OPEN = (OPEN === st.key ? null : st.key); draw(); };
    head.innerHTML = '<span class="num">' + (done ? '✓' : (i + 1)) + '</span>' +
                     '<span class="title">' + st.title + '</span>' +
                     '<span class="chip">' + (done ? '완료' : '') + '</span>';
    el.appendChild(head);

    var body = document.createElement('div');
    body.className = 'body';
    el.appendChild(body);
    box.appendChild(el);
    if (OPEN === st.key) st.render(body, done);
  });
}

/* ───────────────────────── 1. 설치 */
function renderInstall(b, done) {
  b.innerHTML =
    '<div class="note">기록종류·교과영역·공통규칙·학생명단 등 기본 시트를 만듭니다. ' +
    '여러 번 눌러도 안전하며, 이미 입력한 내용은 지워지지 않습니다.</div>' +
    '<div class="warn">처음이라면 이 버튼을 누를 때 구글 승인 화면이 뜹니다.<br>' +
    '<b>[계속]</b> → 계정 선택 → <b>"확인하지 않은 앱"</b> 화면에서 <b>[고급]</b> → ' +
    '<b>[…(안전하지 않음)(으)로 이동]</b> → <b>[허용]</b> 순서로 눌러 주세요.</div>' +
    '<div class="actions"><button class="primary" id="bInstall">' + (done ? '다시 설치' : '설치하기') + '</button></div>' +
    '<div class="msg" id="mInstall"></div>' +
    (ST.imported ? '' :
    '<div class="old"><b>예전에 쓰던 세특 도우미 파일이 있나요?</b> 새 버전으로 옮기는 중이라면 설치 뒤 ' +
      '<button id="bOld" style="padding:4px 10px;font-size:12px">📥 이전 파일에서 가져오기</button><br>' +
      '<span class="note">학생명단 · 활동 · 학생 자료 · AI 결과 · 최종본 · 예시 · 내 문체가 그대로 옮겨져, 아래 3~5단계가 저절로 끝납니다. API 키(2단계)만 다시 넣으면 됩니다.</span></div>');
  if ($('bOld')) $('bOld').onclick = function () { google.script.run.openImportDialog(); };
  $('bInstall').onclick = function () {
    var btn = this; busy(btn, true, '설치 중'); say('mInstall', '');
    google.script.run
      .withSuccessHandler(function (s) { ST = s; busy(btn, false); OPEN = 'ai'; draw(); })
      .withFailureHandler(function (e) { busy(btn, false); say('mInstall', e.message, 'err'); })
      .onboardInstall();
  };
}

/* ───────────────────────── 2. AI 연결 */
function copyText(text, msgId) {
  var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select(); var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  say(msgId, ok ? '✓ 복사했습니다. Gemini 대화창에 붙여 넣으세요(Ctrl+V).' : '복사가 막혔습니다. 칸을 누르고 Ctrl+A → Ctrl+C 하세요.', ok ? 'ok' : 'err');
}
function acctHtml() {
  var a = ST.account || {};
  if (!a.email) return '';
  return '<div class="acct">지금 로그인: <b>' + esc(a.email) + '</b> — ' +
    (a.kind === 'school' ? '학교·기관 계정입니다. 같은 계정으로 <a href="https://gemini.google.com/app" target="_blank">Gemini 앱</a>을 쓰면 대화가 AI 학습에 쓰이지 않습니다(학교에서 켜 두었을 때).'
                         : '개인 계정입니다. 학생 자료는 학교 계정 Gemini 를 권합니다(개인 무료판은 대화가 서비스 개선에 쓰일 수 있음).') + '</div>';
}
function renderAi(b, done) {
  var conn = ST.keyNames.map(function (k) { return LABEL[k] + ' 키 ✓'; });
  if (ST.subscription) conn.push('Gemini 구독 ✓');
  if (ST.manual) conn.push('키 없이(복사·붙여넣기) ✓');
  var way = ST.hasKey ? 'key' : (ST.subscription ? 'sub' : (ST.gem ? 'gem' : (ST.manual ? 'manual' : 'key')));
  b.innerHTML =
    acctHtml() +
    (done ? '<div class="note">연결: <b>' + conn.join(' · ') + '</b>' +
            ' · 주 모델 <b>' + esc(ST.defaultModel) + '</b>' + (ST.backupModel ? ' · 예비 <b>' + esc(ST.backupModel) + '</b>' : '') + '<br>' +
            '키는 여러 개 함께 쓸 수 있습니다. 다른 회사 키를 더 넣으면 주 모델은 그대로 두고 새 쪽을 예비 모델로 둡니다.</div>' : '') +
    '<label>어떻게 연결할까요</label>' +
    '<div class="ways">' +
      '<label class="way" data-w="key"><input type="radio" name="way" value="key"><span><span class="t">API 키가 있다면 — 버튼 한 번에 자동 생성<span class="rec">가장 편함</span></span><br>' +
        '<span class="d">Gemini 키는 무료로 1분이면 받습니다. 여러 명을 한 번에, 자동 고쳐쓰기·근거 확인·AI 맞춤법 검사까지 모두 됩니다.</span></span></label>' +
      '<label class="way" data-w="manual"><input type="radio" name="way" value="manual"><span><span class="t">키가 없다면 — Gemini 앱에 복사·붙여넣기</span><br>' +
        '<span class="d">키·비용·설치가 없습니다. 시트가 만든 요청문을 Gemini(학교 계정)에 붙여 넣고 답을 다시 붙여 넣으면 학생별로 나눠 넣고 검사합니다.</span></span></label>' +
      '<label class="way" data-w="gem"><input type="radio" name="way" value="gem"><span><span class="t">Gemini 앱을 쓴다면 — 💎 Gem을 만들어 두기</span><br>' +
        '<span class="d">구독 계정이나 학교 계정의 Gemini 앱에 활동 규칙을 Gem으로 한 번 저장하고, 다음부터 학생 자료만 붙여 넣습니다. Gem이 쓴 글은 시트에 붙여 넣으면 검사됩니다.</span></span></label>' +
      '<label class="way" data-w="sub"><input type="radio" name="way" value="sub"><span><span class="t">Gemini 구독으로 — =AI() 함수</span><br>' +
        '<span class="d">학교에 Google AI Pro for Education 이 있거나 개인 Google AI Pro·Ultra 일 때. 무료 학교 계정(Education Fundamentals)에는 없습니다.</span></span></label>' +
    '</div>' +
    '<div id="wayManual">' +
      '<div class="note" style="margin-top:10px">이렇게 씁니다: 입력 시트에서 [생성] 체크 → 메뉴 <b>⑥ 체크된 행 생성</b> → 열린 창에서 <b>[📋 전체 복사]</b> → ' +
        '<a href="https://gemini.google.com/app" target="_blank">Gemini</a>에 붙여 넣기 → 받은 답을 창에 붙여 넣기 → 학생별로 [AI 결과]에 들어가고 바로 검사됩니다.<br>' +
        '학생 이름은 요청문에 들어가지 않습니다(S1, S2 … 로 바뀜). 나중에 키를 넣으면 같은 버튼이 자동 생성으로 바뀝니다.</div>' +
      '<div class="actions"><button class="primary" id="bManual">' + (ST.manual ? '키 없이 쓰는 중 ✓ · 다시 맞추기' : '이 방법으로 시작') + '</button></div>' +
      '<div class="msg" id="mManual"></div>' +
    '</div>' +
    '<div id="wayGem">' +
      '<div class="note" style="margin-top:10px">이렇게 씁니다: ③ 명단 → ④ 첫 활동을 만들면 ⑤에서 그 활동의 <b>Gem 지침</b>을 복사할 수 있습니다 → ' +
        '<a href="https://gemini.google.com/gems/create" target="_blank">Gemini › 새 Gem 만들기</a>의 <b>[안내]</b>에 붙여 넣고 저장.<br>' +
        '쓸 때는 메뉴 ⑥ 창의 <b>[학생 자료만 복사 (Gem 사용 시)]</b> → Gem 대화에 붙여 넣기 → 답을 창에 붙여 넣기. ' +
        'Gem에서 바로 쓴 글은 [✍️ 바로 쓰기 · 💎 Gem 시트]의 [최종본]에 붙여 넣어도 검사됩니다. 학생 이름은 S1, S2 … 로 바뀌어 갑니다.</div>' +
      '<div class="actions"><button class="primary" id="bGemWay">' + (ST.gem ? 'Gem으로 쓰는 중 ✓ · 다시 맞추기' : '이 방법으로 시작') + '</button></div>' +
      '<div class="msg" id="mGemWay"></div>' +
    '</div>' +
    '<div id="waySub">' +

    var box = $('testOut');
    box.innerHTML = '<div class="result">' + esc(r.text) + '</div>' +
      '<div class="meta">' + r.bytes + ' / ' + r.limit + ' 바이트' +
      (r.issues.length ? ' · ' + esc(r.issues.join(', ')) : ' · 걸리는 표현 없음') +
      (r.repaired ? ' · 검사에 걸린 점을 자동으로 한 번 고쳐 썼습니다' : '') + '</div>';
    google.script.run.withSuccessHandler(function () {
      ST.done = true;
      box.innerHTML += doneHtml();
      bindDone(a);
    }).onboardFinish();
  };

  if (manualOnly) {
    b.innerHTML =
      '<div class="note"><b>' + esc(a.name) + '</b> 의 ' + (a.quick ? '보기 메모' : '예시 자료') + '로 요청문을 만들었습니다. 학생 자료는 건드리지 않습니다.<br>' +
      '① [요청문 복사] → ② <a href="https://gemini.google.com/app" target="_blank">Gemini</a>(학교 계정)에 붙여 넣기 → ③ 받은 답을 아래에 붙여 넣고 [검사].</div>' +
      '<textarea id="mPrompt" class="mono" rows="5" readonly>만드는 중…</textarea>' +
      '<div class="actions"><button class="primary" id="bMCopy">📋 요청문 복사</button><a href="https://gemini.google.com/app" target="_blank">Gemini 열기</a><span class="msg" id="mMCopy"></span></div>' +
      '<label>받은 답</label><textarea id="mAnswer" rows="5" placeholder="Gemini가 쓴 답을 그대로 붙여 넣으세요"></textarea>' +
      '<div class="actions"><button class="primary" id="bMCheck">검사</button></div>' +
      '<div class="msg" id="mTest"></div><div id="testOut"></div>' +
      '<div class="box" id="gemBox" style="margin-top:12px' + (ST.gem ? ';border-color:var(--accent)' : '') + '"><b>💎 Gem으로 만들어 두기</b> — Gemini 앱을 자주 쓰면 이 활동의 규칙을 Gem에 한 번 저장해 두세요. 다음부터는 학생 자료만 붙여 넣으면 됩니다.' +
        '<div class="actions"><button id="bGemCopy">📋 이 활동의 Gem 지침 복사</button><a href="https://gemini.google.com/gems/create" target="_blank">새 Gem 만들기</a><span class="msg" id="mGemCopy"></span></div>' +
        '<div class="note">[새 Gem 만들기] → 이름 → <b>[안내]</b>에 붙여 넣고 저장 → 쓸 때는 메뉴 ⑥ 창의 [학생 자료만 복사 (Gem 사용 시)]. 규칙·예시를 고치면 메뉴 ⑧ [AI 앱용 지침 내보내기]에서 다시 복사합니다.</div></div>';
    var mt = null;
    google.script.run.withSuccessHandler(function (r) { mt = r; $('mPrompt').value = r.prompt; })
      .withFailureHandler(function (e) { say('mTest', e.message, 'err'); }).onboardManualTest(a.key);
    $('bMCopy').onclick = function () { if (mt) copyText(mt.prompt, 'mMCopy'); };
    var gt = null;
    google.script.run.withSuccessHandler(function (r) { gt = r.gem; }).gemFor(a.key);
    $('bGemCopy').onclick = function () { if (gt) copyText(gt, 'mGemCopy'); else say('mGemCopy', '지침을 만드는 중입니다. 잠시 뒤 다시 눌러 주세요.', 'err'); };
    $('bMCheck').onclick = function () {
      var btn = this; busy(btn, true, '검사 중');
      google.script.run.withSuccessHandler(function (r) {
        busy(btn, false);
        if (!r.ok) { say('mTest', r.message, 'err'); return; }
        say('mTest', '✓ 키 없이도 문장이 나왔습니다. 실제 학생은 메뉴 ⑥ 에서 같은 창으로 한 번에 여러 명씩 합니다.', 'ok');
        show(r);
      }).withFailureHandler(function (e) { busy(btn, false); say('mTest', e.message, 'err'); })
        .onboardManualCheck({ answer: $('mAnswer').value, limit: mt ? mt.limit : 1500 });
    };
    if (done) { $('testOut').innerHTML = doneHtml(); bindDone(a); }
    return;
  }

  if (subOnly) {
    // =AI 수식은 선생님이 셀에서 [생성 및 삽입]을 눌러야 하므로 시험 셀을 만들어 그리로 안내한다
    var cell = null;
    b.innerHTML =
      '<div class="note">구독(=AI 함수)은 스크립트가 대신 눌러 줄 수 없어서, <b>' + esc(a.name) + '</b> 의 예시 자료로 시험 셀을 하나 만들어 드립니다.<br>' +
      '① [시험 셀 만들기] → ② 시트에서 선택된 셀(노란 줄 바로 아래)을 누르고 <b>[생성 및 삽입]</b> → ③ 답이 들어오면 [결과 확인].</div>' +
      '<div class="actions"><button class="primary" id="bSubTest">시험 셀 만들기</button>' +
      '<button id="bSubRead" disabled>결과 확인</button></div>' +
      '<div class="msg" id="mTest"></div><div id="testOut"></div>';
    $('bSubTest').onclick = function () {
      var btn = this; busy(btn, true, '만드는 중'); say('mTest', '');
      google.script.run
        .withSuccessHandler(function (r) {
          busy(btn, false); cell = r; $('bSubRead').disabled = false;
          say('mTest', '[🚀 시작하기] 시트의 ' + r.a1 + ' 셀에 시험 수식을 넣었습니다. 그 셀을 누르고 [생성 및 삽입]을 눌러 주세요.', 'ok');
        })
        .withFailureHandler(function (e) { busy(btn, false); say('mTest', e.message, 'err'); })
        .onboardTestSubscription(a.key);
    };
    $('bSubRead').onclick = function () {
      var btn = this; busy(btn, true, '읽는 중');
      google.script.run
        .withSuccessHandler(function (r) {
          busy(btn, false);
          if (!r.ok) { say('mTest', r.message, 'err'); return; }
          say('mTest', '✓ 구독으로 문장이 나왔습니다. 시험 셀은 지워도 됩니다.', 'ok');
          show(r);
        })
        .withFailureHandler(function (e) { busy(btn, false); say('mTest', e.message, 'err'); })
        .onboardReadSubTest(cell);
    };
    if (done) { $('testOut').innerHTML = doneHtml(); bindDone(a); }
    return;
  }

  b.innerHTML =
    '<div class="note">학생 자료는 건드리지 않고, 방금 만든 <b>' + esc(a.name) + '</b> 의 ' + (a.quick ? '보기 메모' : '예시 자료') + '로 ' +
    '실제 호출을 한 번 돌려 봅니다. 여기서 문장이 나오면 설정이 끝난 것입니다.</div>' +
    '<div class="actions"><button class="primary" id="bTest">시험 삼아 한 건 만들어 보기</button></div>' +
    '<div class="msg" id="mTest"></div><div id="testOut"></div>';

  $('bTest').onclick = function () {
    var btn = this; busy(btn, true, '생성 중'); say('mTest', ''); $('testOut').textContent = '';
    google.script.run
      .withSuccessHandler(function (r) { busy(btn, false); show(r); })
      .withFailureHandler(function (e) { busy(btn, false); say('mTest', e.message, 'err'); })
      .onboardTestGenerate(a.key);
  };

  if (done) { $('testOut').innerHTML = doneHtml(); bindDone(a); }
}

function doneHtml() {
  return '<div class="done-box" style="margin-top:14px">' +
    '<div class="big">설정이 끝났습니다</div>' +
    '<div class="note" style="text-align:left">이제 이렇게 쓰시면 됩니다.<br>' +
    '① 활동의 <b>▸예시</b> 시트에 모범 예시를 채웁니다(바로 쓰기는 없음). 결과 품질을 가장 크게 좌우합니다.<br>' +
    '② <b>▸입력</b> 시트 노란 칸에 학생별 자료(바로 쓰기는 관찰 메모)를 넣습니다.<br>' +
    '③ [생성] 체크 후 메뉴 <b>⑥ 체크된 행 생성</b>.' +
    (ST.subscription && !ST.hasKey ? ' 구독은 이어서 <b>AI 결과</b> 칸들을 선택하고 <b>[생성 및 삽입]</b>을 누릅니다.' : '') +
    (!ST.hasKey && !ST.subscription ? ' 키 없이 쓰면 복사·붙여넣기 창이 열립니다.' : '') + '<br>' +
    '④ AI 결과를 읽고 <b>직접 고쳐</b> 파란 <b>최종본</b> 칸에 넣습니다. 고치면 [검증]이 바로 다시 검사합니다.<br>' +
    '⑤ 메뉴 <b>⑦ 최종취합</b> 으로 모아 나이스에 붙여넣습니다. 맞춤법·금지어는 메뉴 <b>🔍 검사</b>로 한 번 더.</div>' +
    '<div class="actions" style="justify-content:center">' +
    '<button class="primary" id="bGoIn">입력 시트 열기</button>' +
    '<button id="bGoEx">예시 시트 열기</button>' +
    '<button id="bGoHelp">사용법 보기</button></div></div>';
}

function bindDone(a) {
  var go = function (id, name) {
    var el = $(id);
    if (el) el.onclick = function () { google.script.run.onboardGoto(name); };
  };
  go('bGoIn', a.inSheet); go('bGoHelp', '📖 사용법');
  if (a.exSheet) go('bGoEx', a.exSheet); else if ($('bGoEx')) $('bGoEx').hidden = true;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

load();
</script>
</body>
</html>
